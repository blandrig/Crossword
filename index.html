<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossword Rock and Roll</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="responsive.css">
  <style>.cell.selected{background:#e7f3eb}.cell.block.selected{background:var(--ink)}.cell{position:relative}.cell-number{position:absolute;top:1px;left:2px;font-size:8px;line-height:1;color:var(--dark);z-index:2;pointer-events:none}.cell.block .cell-number{color:#fff}.row-labels,.col-labels{display:none}.grid-wrap{display:block}</style>
  <style>.clue-popup{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:#21332f;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px #21332f33;opacity:0;pointer-events:none;transition:.2s;z-index:20;min-width:220px;text-align:center}.clue-popup.show{opacity:1;transform:translate(-50%,0)}.clue-popup small{display:block;color:#b7d9c8;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.clue-popup strong{font-size:14px;font-weight:500}</style>
</head>
<body>
  <main class="app-shell container-fluid">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span> Crossword <em>Rock and Roll</em></div>
      <div class="top-actions">☀ <strong>3 day streak</strong> <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button></div>
    </header>
    <section class="hero"><div><p class="eyebrow">TUESDAY, AUGUST 4</p><h1>Try your hand at<br><span>music trivia.</span></h1><p class="subhead">Music Mayhem</p></div></section>
    <section class="game-layout row g-3 g-lg-4">
      <div class="puzzle-card col-12 col-lg-7">
        <div class="puzzle-meta"><span><b>DAILY MINI</b> · #042</span><span id="progressText">0 / 31 filled</span></div>
        <div class="grid-wrap"><div></div><div id="colLabels" class="col-labels"></div><div id="rowLabels" class="row-labels"></div><div id="grid" class="grid" role="grid" aria-label="18 by 18 crossword grid"></div></div>
        <div class="game-footer"><button class="secondary-btn" id="checkBtn">✓ Check puzzle</button><button class="text-btn" id="clearBtn">Clear all</button></div>
      </div>
      <aside class="clues-card col-12 col-lg-5"><div class="tabs"><button class="tab active" data-direction="across">Across</button><button class="tab" data-direction="down">Down</button></div><div id="clues" class="clues"></div><div class="hint-box"><span>💡</span><div><strong>Need a nudge?</strong><p>Reveal one letter to keep your momentum.</p></div><button id="hintBtn">Reveal</button></div></aside>
    </section>
    <p class="tiny-note">Your progress is saved on this device · <button id="newPuzzleBtn">New puzzle</button></p>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <div id="cluePopup" class="clue-popup" role="status"><small></small><strong></strong></div>
  <script src="app.js?v=11"></script>
  <script>
    (function () {
      const popup = document.getElementById('cluePopup');
      if (!popup || !window.visualViewport) return;
      function movePopupAboveKeyboard() {
        const keyboardHeight = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
        popup.style.bottom = `${keyboardHeight + 16}px`;
      }
      window.visualViewport.addEventListener('resize', movePopupAboveKeyboard);
      window.visualViewport.addEventListener('scroll', movePopupAboveKeyboard);
      window.addEventListener('resize', movePopupAboveKeyboard);
      movePopupAboveKeyboard();
    })();
  </script>
  <script>const cellsNow=document.querySelectorAll('.cell');const d16Number=cellsNow[69]?.querySelector('.cell-number');if(d16Number)d16Number.textContent='17';[['R2',43],['R6',44],['R15',45]].forEach(([key,number])=>{const index=17*18+Number(key.slice(1))-1;const label=cellsNow[index]?.querySelector('.cell-number');if(label)label.textContent=number});</script>
</body>
</html>
